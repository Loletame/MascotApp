<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="login.js" type="module" defer></script>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesion</h2>
        <form id="form-login">
            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username" placeholder="Nombre de usuario" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <details class="credenciales-prueba">
            <summary>Credenciales de prueba</summary>
            <p>Trabajador: empleado / 1234</p>
            <p>Cliente Maria: maria / 1234</p>
            <p>Cliente Nicolas: nicolas / 1234</p>
        </details>
    </div>
</body>
</html>
